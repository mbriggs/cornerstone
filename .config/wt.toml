# Worktrunk Project Configuration
# Copy to: <repo>/.config/wt.toml
#
# Project-specific hooks that run automatically during worktree operations.
# Check this file into git to share hooks across all developers.

# ============================================================================
# Hook Formats
# ============================================================================
# Hooks take one of three forms — pick by intent:
#
# Single command:
#   pre-start = "npm install"
#
# Pipeline (sequential steps, each step may run multiple commands concurrently):
#   [[pre-start]]
#   deps = "npm ci"
#
#   [[pre-start]]
#   build = "npm run build"
#   server = "npm run dev"
#
# Named table (concurrent commands — still valid for post-* hooks, but
# DEPRECATED for pre-* hooks; use [[hook]] blocks there instead):
#   [post-start]
#   server = "npm run dev"
#   watch  = "npm run watch"
#
# Named commands appear in output, making failures easier to identify.

# ============================================================================
# Template Variables — see https://worktrunk.dev/hook/#template-variables
# ============================================================================
# Common variables:
#   {{ repo }}               - Repository directory name (e.g., "myproject")
#   {{ branch }}             - Branch name (e.g., "feature/auth")
#   {{ worktree_path }}      - Absolute path to worktree
#   {{ primary_worktree_path }} - Main worktree (or default branch worktree for bare repos)
#   {{ default_branch }}     - Default branch name (e.g., "main")
#   {{ target }}             - Target branch (merge hooks only)
#
# Filters:
#   {{ branch | sanitize }}     - Replace / and \ with - (e.g., "feature-auth")
#   {{ branch | sanitize_db }}  - Database-safe identifier with hash suffix (e.g., "feature_auth_x7k")
#   {{ branch | hash_port }}    - Deterministic port 10000-19999

# ============================================================================
# Hooks
# ============================================================================
# pre-* hooks BLOCK — failure aborts the operation.
# post-* hooks run in the BACKGROUND — output logged (see `wt config state logs`).
# Prefer post-start over pre-start unless a later step needs the work done first.

# Pre-Start: runs once on worktree creation, BLOCKS the rest of `wt switch`.
# Use for: provisioning that must be done before the worktree is usable
# (dependency install, env file generation, database clone).
#
# [[pre-start]]
# deps = "npm ci"
#
# [[pre-start]]
# env = "cp .env.example .env"

# Post-Start: runs once on worktree creation, in the BACKGROUND.
# Use for: dev servers, file watchers, long builds, cache copies.
#
# [post-start]
# server = "npm run dev -- --port {{ branch | hash_port }}"
# watch  = "npm run watch"

# Post-Switch: runs in the BACKGROUND on every switch (create or re-enter).
# Use for: terminal tab naming, tmux window titles, IDE notifications.
#
# post-switch = "echo -ne '\\033]0;{{ branch }}\\007'"

# Pre-Commit: runs during `wt merge` before the squash commit, BLOCKS (fail-fast).
# Use for: formatters, linters, quick checks.
#
# [[pre-commit]]
# format = "npm run format:check"
# lint   = "npm run lint"

# Pre-Merge: runs during `wt merge` after rebase, before merge to target, BLOCKS.
# Use for: tests, build verification, security scans.
#
# [[pre-merge]]
# test  = "npm test"
# build = "npm run build"

# Post-Merge: runs after a successful merge, in the BACKGROUND.
# Runs in the target branch's worktree if one exists, else the primary worktree.
# Use for: deployment, notifications, installing updated binaries.
#
# post-merge = "echo 'Merged {{ branch }} to {{ target }}'"

# Pre-Remove: runs before worktree removal, BLOCKS (fail-fast).
# Use for: cleanup, stopping services, backing up state.
#
# pre-remove = "docker compose down"

# Post-Remove: runs after worktree removal, in the BACKGROUND.
# Use for: deallocating ports, removing containers, external cleanup.
#
# post-remove = "bin/port-deallocate {{ branch }}"

# ============================================================================
# Aliases (experimental) — run with `wt step <name>`
# ============================================================================
# Command templates that support the same variables as hooks.
# Project-config aliases require command approval on first run.
#
# [aliases]
# deploy = "make deploy BRANCH={{ branch }}"
# url = "echo http://localhost:{{ branch | hash_port }}"

# ============================================================================
# Dev Server URL (shown in `wt list`)
# ============================================================================
# [list]
# url = "http://localhost:{{ branch | hash_port }}"

# ============================================================================
# CI Platform Override
# ============================================================================
# Override CI platform detection for GitHub Enterprise or self-hosted GitLab
# with custom domains where URL detection fails.
#
# [ci]
# platform = "github"  # or "gitlab"
